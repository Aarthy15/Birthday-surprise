<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Maps - Surprise</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:black;
    overflow-x:hidden;
}

/* Header */

.header{
    width:100%;
    min-height:80px;
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;
    padding:15px 20px;
    box-shadow:0 2px 5px rgba(0,0,0,.2);
}

.logo{
    font-size:clamp(28px,4vw,35px);
    font-weight:bold;
    white-space:nowrap;
}

.blue{color:#4285F4;}
.red{color:#EA4335;}
.yellow{color:#FBBC05;}
.green{color:#34A853;}

.search{
    width:100%;
    max-width:450px;
    height:45px;
    border-radius:25px;
    border:1px solid #ddd;
    padding:0 20px;
    font-size:18px;
    outline:none;
}

/* Map */

.map{
    width:100%;
    min-height:calc(100vh - 80px);
    background:url("map.jpg") center center/cover no-repeat;
    position:relative;
}

/* Heart Marker */

.marker{
    position:absolute;
    top:20%;
    left:50%;
    transform:translate(-50%,-50%);
    cursor:pointer;
    animation:beat 1s infinite;
}

.marker img{
    width:150px;
    height:auto;
    border-radius:50%;
}

/* Heart Animation */

@keyframes beat{

0%{
transform:translate(-50%,-50%) scale(1);
}

50%{
transform:translate(-50%,-50%) scale(1.2);
}

100%{
transform:translate(-50%,-50%) scale(1);
}

}

/* Popup */

.popup{

position:absolute;
top:30%;
left:50%;

transform:translate(-50%,20px);

background:black;
color:white;

padding:25px;

width:90%;
max-width:700px;

border-radius:15px;

box-shadow:0 8px 20px rgba(0,0,0,.3);

display:none;

text-align:center;

}

.popup h2{

color:wheat;
margin-bottom:15px;
font-size:clamp(24px,3vw,32px);

}

.popup p{

font-size:18px;
line-height:30px;

}

button{

margin-top:20px;

padding:12px 30px;

border:none;

background:#4285F4;

color:black;

font-size:16px;

border-radius:20px;

cursor:pointer;

}

button:hover{

background:#1a73e8;

}

/* ---------------- Laptop ---------------- */

@media(max-width:1024px){

.marker img{
    width:120px;
}

.popup{
    max-width:600px;
}

}

/* ---------------- Tablet ---------------- */

@media(max-width:768px){

.header{
    flex-direction:column;
    gap:15px;
    padding:20px;
}

.search{
    max-width:100%;
}

.marker{
    top:25%;
}

.marker img{
    width:100px;
}

.popup{
    top:35%;
    padding:20px;
}

.popup p{
    font-size:16px;
    line-height:28px;
}

}

/* ---------------- Mobile ---------------- */

@media(max-width:480px){

.header{
    padding:15px;
}

.logo{
    font-size:30px;
}

.search{
    height:42px;
    font-size:15px;
}

.marker{
    top:23%;
}

.marker img{
    width:80px;
}

.popup{
    width:95%;
    top:30%;
    padding:15px;
}

.popup h2{
    font-size:22px;
}

.popup p{
    font-size:14px;
    line-height:24px;
}

button{
    width:100%;
    padding:12px;
    font-size:15px;
}

}

</style>

</head>

<body>

<div class="header">

<div class="logo">

<span class="blue">G</span>
<span class="red">o</span>
<span class="yellow">o</span>
<span class="blue">g</span>
<span class="green">l</span>
<span class="red">e</span>

</div>

<input
type="text"
class="search"
value="Click the Heart ❤️"
readonly>

</div>

<div class="map">

<div class="marker" onclick="showPopup()">
    <img src="photos\heart.jpg" alt="Photo 1">

</div>

<div class="popup" id="popup">

<h2>Destination Found </h2>
<p>
📍 Current location : <strong>Gowtham Ramamurthy</strong>
</p>
<p>
  Destination : <strong>Aarthy's Heart</strong>
</p>
<p>
 Started :<strong> 30/11/2025</strong>
</p>
<p>
 Distance :<strong>0 km</strong>
</p>
<p>
    Status : <strong> You have been here all along ❤️</strong>
</p>
<p>
    Arrival time : <strong> A Lifetime Together!</strong>
</p>
<p>
    Estimate stay: <strong> Forever </strong>
</p>
<p>
    Note : <strong> There is no exit from this location </strong>
</p>
<button onclick="hidePopup()">
Close
</button>

</div>

</div>

<script>

function showPopup(){

document.getElementById("popup").style.display="block";

}

function hidePopup(){

document.getElementById("popup").style.display="none";

}

</script>

</body>
</html>
