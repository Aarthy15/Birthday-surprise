<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Video</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:40px;
    font-family:Arial,sans-serif;
}

/* Video Container */

.video-container{
    width:80%;
    max-width:700px;
    height:450px;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* Video */

video{
    width:100%;
    height:100%;
    object-fit:contain;   /* Shows full video */
    background:#000;
    border-radius:15px;
    box-shadow:0 0 20px rgba(255,255,255,.15);
}

/* ---------- Laptop ---------- */

@media (max-width:1024px){

    .video-container{
        width:75%;
        height:400px;
    }

}

/* ---------- Tablet ---------- */

@media (max-width:768px){

    body{
        padding:30px;
    }

    .video-container{
        width:85%;
        height:320px;
    }

}

/* ---------- Mobile ---------- */

@media (max-width:480px){

    body{
        padding:20px;
    }

    .video-container{
        width:100%;
        height:220px;
    }

    video{
        border-radius:10px;
    }

}
</style>

</head>
<body>

<div class="video-container">

    <video controls autoplay muted>
        <source src="C:\Users\gowth\OneDrive\Desktop\Aarthy\Birthday surprise\photos\video.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

</div>

</body>
</html>
