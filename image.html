<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    padding:20px;
}

.gallery{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
}

.gallery img{
    width:350px;
    height:250px;
    object-fit:contain;
    border:2px solid white;
    border-radius:10px;
    box-shadow:4px 7px 7px rgba(0,0,0,0.3);
    cursor:pointer;
    margin:10px;
    transition:0.4s;
    max-width:100%;
}

.gallery img:hover{
    filter:grayscale(2);
    transform:scale(1.08);
}

/* ---------- Laptop (1024px and below) ---------- */
@media (max-width:1024px){

    .gallery img{
        width:300px;
        height:220px;
    }

}

/* ---------- Tablet (768px and below) ---------- */
@media (max-width:768px){

    body{
        padding:15px;
    }

    .gallery img{
        width:45%;
        height:200px;
        margin:8px;
    }

}

/* ---------- Mobile (480px and below) ---------- */
@media (max-width:480px){

    body{
        padding:10px;
    }

    .gallery{
        flex-direction:column;
    }

    .gallery img{
        width:100%;
        height:auto;
        margin:10px 0;
    }

    .gallery img:hover{
        transform:scale(1.03);
    }

}
</style>
